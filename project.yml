name: LocationSpoofer
options:
  bundleIdPrefix: com.locationspoofer
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  LocationSpoofer:
    type: application
    platform: iOS
    resources:
      - Resources/location-spoofer.js
      - Resources/location-spoofer-qx.js
      - Resources/location-spoofer-config.json
    sources:
      - Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 定位欺骗
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: App 需要本地网络权限来运行内置 HTTP 服务器
        NSLocationWhenInUseUsageDescription: 用于在地图上显示当前位置
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.locationspoofer.app
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
